        // === AI shot recommender sheet ===
        // Two-tier render:
        //   1. INPUTS — what the engine sees as decision factors (always shown):
        //      - 亚盘 line + 水位 + 升降盘趋势 (open vs current)
        //      - 强弱判断 + 6 次射中的人数分配（公式）
        //      - 两队首发/替补人数、阵型
        //      - 关键候选球员（按累计射正排名 top 5/team）
        //   2. OUTPUT — engine recommendation (when ready):
        //      - 6 picks with multi-shot stars + reasons
        //      - placeholder「引擎尚未为本场生成方案」when KV is empty
        async function openShotRecommenderSheet() {
            const sheet = document.getElementById('shotRecommenderSheet');
            sheet.classList.add('visible');
            const body = document.getElementById('shotRecommenderBody');
            // Reset title to a neutral placeholder while loading; renderShotRecommenderSheet
            // will overwrite it with the actual "主 vs 客" matchup once data arrives.
            const titleEl = document.getElementById('shotRecommenderTitle');
            if (titleEl) titleEl.textContent = '射门推荐';
            if (!currentLineupFixtureId) {
                body.innerHTML = '<div class="stats-empty">缺少比赛上下文</div>';
                return;
            }
            body.innerHTML = '<div class="stats-empty">加载中…</div>';
            try {
                // Inputs come from the same /api/fifa/lineup response we already
                // loaded; cheaper than 2nd fetch. Reuse currentLineupData if fresh.
                const lineupResp = currentLineupData
                    ? Promise.resolve(currentLineupData)
                    : fetch(`/api/fifa/lineup/${currentLineupFixtureId}?_t=${Date.now()}`, { cache: 'no-store' }).then(r => r.json());
                // Recommendation output (may not exist yet)
                const recResp = fetch(`/api/recommend/shots/${currentLineupFixtureId}?_t=${Date.now()}`, { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null);
                const [lineupData, recommendation] = await Promise.all([lineupResp, recResp]);
                renderShotRecommenderSheet(lineupData, recommendation);
            } catch (e) {
                body.innerHTML = `<div class="stats-empty">加载失败: ${e.message}</div>`;
            }
        }

        function closeShotRecommenderSheet() {
            document.getElementById('shotRecommenderSheet').classList.remove('visible');
        }

        // Format a number with sign and fixed precision (gracefully handles undefined).
        function _fmtNum(n, digits = 2) {
            if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
            return Number(n).toFixed(digits).replace(/\.?0+$/, '');
        }

        // Mirrors worker decideStrongSide (workers/shot-recommender/index.js).
        // 500.com Crown sign convention:
        //   line > 0  → 主队受让 → AWAY is strong (favourite, gives goals)
        //   line < 0  → 主队让   → HOME is strong (favourite, gives goals)
        //   line == 0 → pick-em
        function _decideStrongSideClient(line) {
            const abs = Math.abs(line);
            if (line > 0.01) return { side: 'away', label: '客队', abs };
            if (line < -0.01) return { side: 'home', label: '主队', abs };
            return { side: 'home', label: '平手盘', abs: 0 };
        }
        // Distribution rule: based on |line| magnitude, decide how many of
        // 6 shot quota go to strong vs weak side. Returns [strongCount, weakCount].
        // The line magnitude shown to the user is the ACTUAL line.abs (not a
        // bucket label) — bucketing is purely internal for shot allocation.
        function _distributionForLine(abs) {
            if (abs >= 1.5) return [6, 0];
            if (abs >= 1.0) return [5, 1];
            if (abs >= 0.25) return [4, 2];
            return [3, 3];
        }

        function renderShotRecommenderSheet(lineupData, rec) {
            const body = document.getElementById('shotRecommenderBody');
            const meta = lineupData?.fixture_meta;
            const ah = lineupData?.asian_handicap;
            const lineup = lineupData?.lineup;
            if (!meta) { body.innerHTML = '<div class="stats-empty">比赛元数据缺失</div>'; return; }

            // Set sheet header to "主队 vs 客队" — per user spec, the matchup is
            // more informative than a generic "射门推荐" label. Use Chinese
            // country names from fixture_meta; fall back to the raw country code.
            const homeZh = meta.home?.country_zh || meta.home?.country_code || '主';
            const awayZh = meta.away?.country_zh || meta.away?.country_code || '客';
            const titleEl = document.getElementById('shotRecommenderTitle');
            if (titleEl) titleEl.textContent = `${homeZh} vs ${awayZh}`;

            // === SECTION 1: 亚盘决策依据 ===
            let ahSection;
            if (!ah || !ah.current) {
                ahSection = `<div class="bot-section-title">📊 亚盘决策依据</div>
                  <div class="bot-card bot-info">
                    亚盘数据尚未拉到（500.com 抓取窗口为开赛前 48h）
                  </div>`;
            } else {
                const cur = ah.current;
                const open = ah.open || {};
                const strong = _decideStrongSideClient(cur.line);
                const [strongCnt, weakCnt] = _distributionForLine(strong.abs);
                // Display the actual signed line magnitude (e.g. "让 2.25 球"),
                // not a coarse bucket like "让 2 球".
                const strongLineLabel = (strong.abs < 0.01)
                    ? '平手盘'
                    : `让 ${_fmtNum(strong.abs)} 球`;
                const lineDelta = (cur.line !== undefined && open.line !== undefined)
                    ? (Math.abs(cur.line) - Math.abs(open.line)).toFixed(2).replace(/\.?0+$/, '')
                    : null;
                const homeWaterDelta = (open.home_water !== undefined)
                    ? (cur.home_water - open.home_water).toFixed(3).replace(/\.?0+$/, '')
                    : null;
                const awayWaterDelta = (open.away_water !== undefined)
                    ? (cur.away_water - open.away_water).toFixed(3).replace(/\.?0+$/, '')
                    : null;
                const trendLabel = ah.trend === 'rising' ? '↗ 升盘（让球加大，强队信心增强）'
                                 : ah.trend === 'falling' ? '↘ 降盘（让球缩水，强队信心动摇）'
                                 : '— 持平';
                const trendCls = `trend-${ah.trend || 'stable'}`;

                // Phrase line from HOME perspective (per user spec — no "客让"):
                //   line > 0  → 主队受让 X 球    (away strong)
                //   line < 0  → 主队让 X 球      (home strong)
                //   line == 0 → 平手
                const absLineStr = _fmtNum(Math.abs(cur.line));
                const curLineLabel = (Math.abs(cur.line) < 0.01) ? '平手'
                                   : (cur.line > 0)              ? `主队受让 ${absLineStr} 球`
                                                                 : `主队让 ${absLineStr} 球`;
                const openAbsStr = _fmtNum(Math.abs(open.line ?? 0));
                const openLineLabel = (open.line === undefined || open.line === null) ? '—'
                                    : (Math.abs(open.line) < 0.01) ? '平手'
                                    : (open.line > 0)              ? `主队受让 ${openAbsStr} 球`
                                                                   : `主队让 ${openAbsStr} 球`;

                // 即时盘口/初盘 行：水位按「主水位/客水位」固定顺序展示，但用上下盘文字标注
                //   line > 0 (主受让): 主=下盘, 客=上盘 → 显示 "下 0.90 / 上 0.98"
                //   line < 0 (主让):   主=上盘, 客=下盘 → 显示 "上 X / 下 Y"
                //   line == 0 (平手):  无上下盘 → 显示 "主 X / 客 Y"
                function _hostLabels(lineForSign) {
                    // returns [homeLabel, awayLabel]
                    if (lineForSign > 0.01) return ['下', '上'];
                    if (lineForSign < -0.01) return ['上', '下'];
                    return ['主', '客'];
                }
                const [curHomeL, curAwayL] = _hostLabels(cur.line);
                const [openHomeL, openAwayL] = _hostLabels(open.line ?? cur.line);

                // 水位变动也用主/客固定顺序 + 上下盘标签
                const [deltaHomeL, deltaAwayL] = _hostLabels(cur.line);

                ahSection = `
                  <div class="bot-section-title">📊 亚盘决策依据 · 皇冠</div>
                  <div class="bot-card">
                    <div class="bot-row"><span class="bot-k">即时盘口</span>
                      <span class="bot-v">${curLineLabel} · ${curHomeL} ${_fmtNum(cur.home_water)} / ${curAwayL} ${_fmtNum(cur.away_water)}</span></div>
                    <div class="bot-row"><span class="bot-k">初盘</span>
                      <span class="bot-v">${openLineLabel} · ${openHomeL} ${_fmtNum(open.home_water)} / ${openAwayL} ${_fmtNum(open.away_water)}</span></div>
                    <div class="bot-row"><span class="bot-k">让球变动</span>
                      <span class="bot-v">${lineDelta != null ? (lineDelta > 0 ? '+' : '') + lineDelta : '—'}</span></div>
                    <div class="bot-row"><span class="bot-k">水位变动</span>
                      <span class="bot-v">${deltaHomeL} ${homeWaterDelta ?? '—'} / ${deltaAwayL} ${awayWaterDelta ?? '—'}</span></div>
                    <div class="bot-row"><span class="bot-k">趋势</span>
                      <span class="bot-v bot-trend ${trendCls}">${trendLabel}</span></div>
                    <div class="bot-divider"></div>
                    <div class="bot-row"><span class="bot-k">强弱判断</span>
                      <span class="bot-v">${strong.label}强（${strongLineLabel}）</span></div>
                    <div class="bot-row"><span class="bot-k">6 次射中分配</span>
                      <span class="bot-v"><strong style="color:#0a2f5c">强 ${strongCnt}</strong> · <strong style="color:#c62828">弱 ${weakCnt}</strong></span></div>
                  </div>`;
            }

            // === SECTION 2: 阵容 / 关键候选球员 ===
            let lineupSection;
            if (!lineup) {
                lineupSection = `<div class="bot-section-title">⚽ 阵容信息</div>
                  <div class="bot-card bot-info">
                    阵容尚未公布（FIFA 通常在开赛前 60-90 分钟公布首发）<br>
                    引擎将基于完整国家队大名单的累计统计进行赛前预测
                  </div>`;
            } else {
                const homeTactics = lineup.home?.tactics || '?';
                const awayTactics = lineup.away?.tactics || '?';
                const homeStarters = (lineup.home?.starting || []).length;
                const awayStarters = (lineup.away?.starting || []).length;
                lineupSection = `
                  <div class="bot-section-title">⚽ 阵容信息（已公布）</div>
                  <div class="bot-card">
                    <div class="bot-row"><span class="bot-k">${meta.home.country_zh}</span>
                      <span class="bot-v">${homeStarters} 首发 · 阵型 ${homeTactics}</span></div>
                    <div class="bot-row"><span class="bot-k">${meta.away.country_zh}</span>
                      <span class="bot-v">${awayStarters} 首发 · 阵型 ${awayTactics}</span></div>
                  </div>`;
            }

            // === SECTION 3: 引擎推荐输出 ===
            let outputSection;
            if (!rec || !rec.picks) {
                outputSection = `
                  <div class="bot-section-title">🎯 引擎推荐方案</div>
                  <div class="bot-card bot-info">
                    引擎尚未为本场比赛生成推荐方案<br>
                    <span style="font-size:11px; color:#aaa; display:block; margin-top:4px">
                      推荐每 5 分钟自动刷新，开赛前 8 小时内生成预测版（🔮），<br>
                      FIFA 公布首发后切换为确认版（✅）。请稍候再试
                    </span>
                  </div>`;
            } else {
                const picks = rec.picks || [];
                const strong = picks.filter(p => p.side === rec.strong_side);
                const weak = picks.filter(p => p.side !== rec.strong_side);

                // Build pid → {shirt, country_code} lookup from lineupData
                // (preview stage may not have lineup; fall back gracefully)
                const shirtByPid = {};
                const countryBySide = {
                    home: meta?.home?.country_code || null,
                    away: meta?.away?.country_code || null,
                };
                if (lineup) {
                    for (const side of ['home', 'away']) {
                        const team = lineup[side] || {};
                        for (const grp of ['starting', 'substitutes']) {
                            for (const p of (team[grp] || [])) {
                                if (p.player_id != null) {
                                    shirtByPid[String(p.player_id)] = p.shirt_number;
                                }
                            }
                        }
                    }
                }
                // Helper: country code → flag emoji via /api/fifa/flag/{code}
                // is too heavy for the lineup-bot sheet — use inline <img>
                const flagImg = (code) => code
                    ? `<img src="/api/fifa/flag/${code}" alt="${code}" class="bot-pick-flag" onerror="this.style.display='none'">`
                    : '';
                const renderPick = (p, i) => {
                    const cc = countryBySide[p.side];
                    const flag = flagImg(cc);
                    // Worker 写 KV 时可能已自带 shirt_number / country_code（向前兼容）；
                    // 否则用前端 lookup 兜底
                    const shirt = p.shirt_number ?? shirtByPid[String(p.pid)];
                    // 球衣号去掉 # 前缀，仅显示数字（#留给最左列序号）
                    const shirtHtml = (shirt != null) ? `<span class="bot-pick-shirt">${shirt}</span>` : '';
                    const star = p.shots >= 2 ? `<span class="bot-shots-badge">⭐ ${p.shots} 次</span>` : '';
                    return `<div class="bot-pick-card">
                        <div class="bot-pick-head">
                            <span class="bot-pick-rank">#${i+1}</span>
                            ${flag}
                            ${shirtHtml}
                            <span class="bot-pick-name">${p.name || p.pid}</span>
                            ${star}
                            <span class="bot-pick-score">${(p.score || 0).toFixed(1)}</span>
                        </div>
                        ${p.reason ? `<div class="bot-pick-reason">${p.reason}</div>` : ''}
                    </div>`;
                };
                // Preview snapshot — if this is a confirmed stage rec that
                // started as a preview, surface the original preview picks
                // below the confirmed list as a collapsible diff section.
                const previewSnap = rec.preview_snapshot;
                let previewBlock = '';
                if (rec.stage === 'confirmed' && previewSnap?.picks?.length) {
                    const previewPicks = previewSnap.picks;
                    // Diff: identify which current picks WEREN'T in preview, and vice versa
                    const currentPids = new Set(rec.picks.map(p => p.pid));
                    const previewPids = new Set(previewPicks.map(p => p.pid));
                    const removed = previewPicks.filter(p => !currentPids.has(p.pid));
                    const added = rec.picks.filter(p => !previewPids.has(p.pid));
                    const diffSummary = (added.length || removed.length)
                        ? `<span class="bot-preview-diff-summary">${added.length ? '⊕' + added.length : ''}${removed.length ? ' ⊖' + removed.length : ''}</span>`
                        : '<span class="bot-preview-diff-summary">无变动</span>';
                    const prevAt = previewSnap.generated_at?.slice(0,16).replace('T',' ') || '';
                    const trAt = rec.preview_to_confirmed_at?.slice(0,16).replace('T',' ') || '';
                    const renderPreviewPick = (p, i) => {
                        const flag = flagImg(p.country_code || countryBySide[p.side]);
                        const shirt = p.shirt_number;
                        const shirtHtml = (shirt != null) ? `<span class="bot-pick-shirt">${shirt}</span>` : '';
                        const inCurrent = currentPids.has(p.pid);
                        const tag = inCurrent ? '' : '<span class="bot-preview-removed">⊖ 已移除</span>';
                        return `<div class="bot-pick-card bot-pick-preview${inCurrent ? '' : ' bot-pick-removed'}">
                            <div class="bot-pick-head">
                                <span class="bot-pick-rank">#${i+1}</span>
                                ${flag}${shirtHtml}
                                <span class="bot-pick-name">${p.name || p.pid}</span>
                                ${p.shots >= 2 ? `<span class="bot-shots-badge">⭐ ${p.shots} 次</span>` : ''}
                                ${tag}
                            </div>
                        </div>`;
                    };
                    previewBlock = `
                        <details class="bot-preview-snapshot">
                            <summary>
                                <span class="bot-preview-summary-title">🔮 之前的预测版</span>
                                ${diffSummary}
                            </summary>
                            <div class="bot-preview-meta">预测于 ${prevAt} · 确认于 ${trAt}</div>
                            ${previewPicks.map((p,i)=>renderPreviewPick(p,i)).join('')}
                        </details>
                    `;
                }
                outputSection = `
                  <div class="bot-section-title">🎯 引擎推荐方案 ${rec.stage === 'confirmed' ? '<span class="bot-stage-badge bot-stage-confirmed">✅ 确认版</span>' : '<span class="bot-stage-badge bot-stage-preview">🔮 预测版</span>'}</div>
                  ${strong.map((p,i)=>renderPick(p,i)).join('')}
                  ${weak.map((p,i)=>renderPick(p,i+strong.length)).join('')}
                  ${rec.model_version ? `<div class="bot-meta">模型 ${rec.model_version} · ${rec.generated_at?.slice(0,16).replace('T',' ') || ''}</div>` : ''}
                  ${previewBlock}
                `;
            }

            // === SECTION 4: 候选射手名单（每队 top-4） ===
            // 由 worker 写入 rec.candidate_pools，按 SVM 概率排序前 4 人/队。
            // 用于人工核对/调整推荐方案 — 看看引擎在"几乎入选"的边界上选了谁。
            let candidatesSection = '';
            if (rec?.candidate_pools) {
                const pools = rec.candidate_pools;
                const POS_LABEL_ZH = { 0: '门将', 1: '后卫', 2: '中场', 3: '前锋', 6: '其他' };
                const sideHtml = ['home', 'away'].map(side => {
                    const list = pools[side] || [];
                    if (!list.length) return '';
                    const cc = side === 'home' ? meta.home?.country_code : meta.away?.country_code;
                    const zh = side === 'home' ? (meta.home?.country_zh || cc) : (meta.away?.country_zh || cc);
                    const flag = cc ? `<img src="/api/fifa/flag/${cc}" alt="${cc}" class="bot-pick-flag" onerror="this.style.display='none'">` : '';
                    const rows = list.map((c, i) => {
                        const posLbl = POS_LABEL_ZH[c.position] || '';
                        const shirtHtml = (c.shirt_number != null) ? `<span class="bot-pick-shirt">${c.shirt_number}</span>` : '';
                        const probPct = (c.prob * 100).toFixed(0);
                        return `<div class="bot-candidate-row">
                            <span class="bot-pick-rank">#${i+1}</span>
                            ${shirtHtml}
                            <span class="bot-pick-name">${c.name || c.pid}</span>
                            <span class="bot-candidate-pos">${posLbl}</span>
                            <span class="bot-pick-score">${probPct}%</span>
                        </div>`;
                    }).join('');
                    return `<div class="bot-candidate-team">
                        <div class="bot-candidate-team-head">${flag}<span>${zh}</span></div>
                        ${rows}
                    </div>`;
                }).join('');
                candidatesSection = `
                  <div class="bot-section-title">🔍 候选射手名单 <span class="bot-section-sub">(SVM 概率 top-4 / 队，便于人工调整)</span></div>
                  <div class="bot-card bot-candidate-card">${sideHtml}</div>`;
            }

            body.innerHTML = ahSection + lineupSection + outputSection + candidatesSection;
        }

        // Sheet-scoped pull-to-refresh — independent of the page-level pull-refresh
        // (which binds to document and only fires when window.scrollY === 0).
        // The live events sheet is full-screen but its scroll container is liveEventsTableWrap,
        // not the document, so we need a separate listener attached to the sheet itself.
        let _liveSheetPullBound = false;
        function attachLiveSheetPullRefresh() {
            if (_liveSheetPullBound) return;
            _liveSheetPullBound = true;
            const sheet = document.getElementById('liveEventsSheet');
            const wrap = document.getElementById('liveEventsTableWrap');
            // Visual indicator anchored to the sheet's top (under the header)
            const ind = document.createElement('div');
            ind.id = 'liveSheetPullIndicator';
            ind.style.cssText = 'height:0;display:flex;align-items:center;justify-content:center;background:#f0f0f0;overflow:hidden;transition:height 0.2s;font-size:13px;color:#666;flex-shrink:0;';
            ind.textContent = '下拉刷新';
            // Insert AFTER the header but BEFORE the table wrap
            wrap.parentElement.insertBefore(ind, wrap);

            let startY = 0, pulling = false, refreshing = false;
            const threshold = 80;

            sheet.addEventListener('touchstart', (e) => {
                // Only when the scrollable container is at top
                if (wrap.scrollTop === 0 && !refreshing) {
                    startY = e.touches[0].clientY;
                    pulling = true;
                }
            }, { passive: true });

            sheet.addEventListener('touchmove', (e) => {
                if (!pulling || refreshing) return;
                const dy = e.touches[0].clientY - startY;
                if (dy > 0 && wrap.scrollTop === 0) {
                    const h = Math.min(dy * 0.5, threshold + 20);
                    ind.style.height = h + 'px';
                    ind.textContent = h >= threshold ? '释放刷新' : '下拉刷新';
                }
            }, { passive: true });

            sheet.addEventListener('touchend', () => {
                if (!pulling) return;
                pulling = false;
                const h = parseInt(ind.style.height) || 0;
                if (h >= threshold) {
                    refreshing = true;
                    ind.style.height = '50px';
                    ind.textContent = '刷新中...';
                    Promise.resolve(loadLiveEvents({ bustCache: true })).finally(() => {
                        refreshing = false;
                        ind.style.height = '0';
                    });
                } else {
                    ind.style.height = '0';
                }
            });
        }

        function switchLiveSort(col) {
            if (currentLiveSort.col === col) {
                currentLiveSort.dir = currentLiveSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                currentLiveSort.col = col;
                currentLiveSort.dir = 'desc';
            }
            renderLiveEventsTable();
        }

        function renderLiveEventsTable() {
            if (!currentLiveEventsData) return;
            const players = (currentLiveEventsData.players || []).slice();
            const sortCol = currentLiveSort.col;
            players.sort((a, b) => {
                const va = a[sortCol] ?? 0, vb = b[sortCol] ?? 0;
                return currentLiveSort.dir === 'desc' ? (vb - va) : (va - vb);
            });

            // Header
            let html = `<div class="stats-row header">
                <div class="stats-player-block">Player</div>
                <div class="stats-data-block">`;
            for (const col of LIVE_COLS) {
                const sortCls = currentLiveSort.col === col.key
                    ? (currentLiveSort.dir === 'desc' ? 'sort-desc' : 'sort-asc')
                    : '';
                html += `<div class="stats-cell ${sortCls}" title="${col.glossary}" onclick="switchLiveSort('${col.key}')">${col.label}</div>`;
            }
            html += `</div></div>`;

            // Rows
            const home = currentLiveEventsData.home, away = currentLiveEventsData.away;
            for (const p of players) {
                const teamSide = p.side === 'home' ? home : away;
                const flagUrl = `/api/fifa/flag/${teamSide.country_code}`;
                const shirt = p.shirt_number != null ? p.shirt_number : '';
                // Sub context line under name: shows who they replaced (if came on)
                // OR who replaced them (if went off)
                // Sub indicator: minimal arrow + minute, inline next to name
                //   ↑ 71'  = came on at 71' (sub who replaced a starter)
                //   ↓ 71'  = went off at 71' (starter replaced)
                // Color: green = on, red = off. No descriptive text — saves horizontal space.
                // Sub badge presence is driven by the SUB RELATION (replaces_player_id /
                // replaced_player_id), NOT by minute. Reason: FIFA records HT mass-subs
                // with Minute='' (empty string) — e.g. KOR's 3 HT subs against RSA on
                // 2026-06-25. Falling back to minute as the existence check skipped them.
                // When minute is missing we tag it 'HT' (half-time, FIFA's convention).
                //
                // Counterpart name (LAST_NAME only — saves horizontal space) is shown
                // INSIDE the badge: e.g. "↓HT SON" = went off at HT, replaced by SON.
                // FIFA names are "FAMILY Given" (e.g. "SON Heungmin"), so the first
                // whitespace-delimited token is the family name in uppercase.
                const lastName = (n) => {
                    if (!n) return '';
                    const t = String(n).trim().split(/\s+/)[0];
                    return t || '';
                };
                let subBadge = '';
                if (p.replaces_player_id) {
                    const t = p.replaces_at_minute || 'HT';
                    const ln = lastName(p.replaces_player_name);
                    subBadge = `<span class="live-sub-badge on">↑${t}${ln ? ' ' + escapeHtml(ln) : ''}</span>`;
                } else if (p.replaced_player_id) {
                    const t = p.replaced_at_minute || 'HT';
                    const ln = lastName(p.replaced_player_name);
                    subBadge = `<span class="live-sub-badge off">↓${t}${ln ? ' ' + escapeHtml(ln) : ''}</span>`;
                }

                html += `<div class="stats-row">
                    <div class="stats-player-block">
                        <img src="${flagUrl}" class="stats-player-flag" loading="lazy" onerror="this.style.display='none'">
                        <span class="stats-player-shirt">${shirt}</span>
                        <div class="stats-player-info">
                            <span class="stats-player-name">${escapeHtml(p.name)}</span>
                            ${subBadge}
                        </div>
                    </div>
                    <div class="stats-data-block">`;
                for (const col of LIVE_COLS) {
                    const v = p[col.key];
                    const display = (v === null || v === undefined) ? '—' : v;
                    const zeroCls = (v === 0) ? ' zero' : '';
                    html += `<div class="stats-cell${zeroCls}">${display}</div>`;
                }
                html += `</div></div>`;
            }

            // Footer note showing freshness
            const fetched = currentLiveEventsData.fetched_at
                ? currentLiveEventsData.fetched_at.slice(0, 16).replace('T', ' ')
                : '—';
            html += `<div style="padding:10px 14px;font-size:11px;color:#888;text-align:center">本场实时数据 · 最后更新 ${fetched}</div>`;

            document.getElementById('liveEventsTableWrap').innerHTML = html;

            // Sync scroll across data blocks
            const blocks = document.querySelectorAll('#liveEventsTableWrap .stats-row .stats-data-block');
            let syncing = false;
            blocks.forEach(blk => {
                blk.addEventListener('scroll', () => {
                    if (syncing) return;
                    syncing = true;
                    const left = blk.scrollLeft;
                    blocks.forEach(other => { if (other !== blk) other.scrollLeft = left; });
                    requestAnimationFrame(() => { syncing = false; });
                });
            });
        }

        function renderStatsCategoryTabs() {
            const html = STATS_CATEGORIES.map(c =>
                `<div class="stats-category-tab ${c.key === currentStatsCategory ? 'active' : ''}" onclick="switchStatsCategory('${c.key}')">${c.label}</div>`
            ).join('');
            document.getElementById('statsCategoryTabs').innerHTML = html;
        }

        function switchStatsCategory(key) {
            currentStatsCategory = key;
            const cat = STATS_CATEGORIES.find(c => c.key === key);
            currentStatsSort = { col: cat.defaultSort, dir: 'desc' };
            renderStatsCategoryTabs();
            renderStatsTable();
        }

        function switchStatsSort(colKey) {
            if (currentStatsSort.col === colKey) {
                currentStatsSort.dir = currentStatsSort.dir === 'desc' ? 'asc' : 'desc';
            } else {
                currentStatsSort = { col: colKey, dir: 'desc' };
            }
            renderStatsTable();
        }

        function getStatValue(player, col, section) {
            const ts = player.tournament_stats || {};
            // topLevel: read from tournament_stats directly (minutes_played, matches_played)
            // otherwise: read from the section bucket (attacking / discipline)
            if (col.topLevel) return ts[col.key];
            return (ts[section] || {})[col.key];
        }

        function renderStatsTable() {
            if (!currentStatsData) return;
            const cat = STATS_CATEGORIES.find(c => c.key === currentStatsCategory);
            const cols = cat.cols;
            const section = cat.section;
            const finalCols = cols;

            // Only show starters when lineup is locked (22 players)
            const allPlayers = currentStatsData.players || [];
            const starters = allPlayers.filter(p => p.lineup_role === 'starter');
            const lineupLocked = starters.length === 22;
            const playersToShow = lineupLocked ? starters : allPlayers;

            // Sort by current sort col
            const sortCol = finalCols.find(c => c.key === currentStatsSort.col) || finalCols[0];
            const sorted = [...playersToShow].sort((a, b) => {
                const va = getStatValue(a, sortCol, section);
                const vb = getStatValue(b, sortCol, section);
                const aNull = va === null || va === undefined;
                const bNull = vb === null || vb === undefined;
                if (aNull && bNull) return 0;
                if (aNull) return 1;
                if (bNull) return -1;
                return currentStatsSort.dir === 'desc' ? (vb - va) : (va - vb);
            });

            // Build div-based table (avoids iOS Safari sticky-in-table bug)
            // Each row: <player block (fixed left)> + <data block (horizontal scroll)>
            // Per-row horizontal scroll is synced across rows via JS.

            // Header row
            let html = `<div class="stats-row header">
                <div class="stats-player-block">Player</div>
                <div class="stats-data-block">`;
            for (const col of finalCols) {
                const sortCls = currentStatsSort.col === col.key
                    ? (currentStatsSort.dir === 'desc' ? 'sort-desc' : 'sort-asc')
                    : '';
                const title = col.glossary || col.label;
                html += `<div class="stats-cell ${sortCls}" title="${title}" onclick="switchStatsSort('${col.key}')">${col.label}</div>`;
            }
            html += `</div></div>`;

            // Data rows
            sorted.forEach(p => {
                const home = currentStatsData.home, away = currentStatsData.away;
                const teamSide = p.side === 'home' ? home : away;
                const flagUrl = `/api/fifa/flag/${teamSide.country_code}`;
                const nameDisplay = p.name?.eng || p.name_default || `Player ${p.player_id}`;
                const shirt = p.shirt_number != null ? p.shirt_number : '';
                const roleBadge = (!lineupLocked && p.lineup_role !== 'starter')
                    ? '<span style="font-size:9px;color:#bbb;margin-left:3px">SUB</span>'
                    : '';

                html += `<div class="stats-row">
                    <div class="stats-player-block">
                        <img src="${flagUrl}" class="stats-player-flag" loading="lazy" onerror="this.style.display='none'">
                        <span class="stats-player-shirt">${shirt}</span>
                        <span class="stats-player-name">${nameDisplay}${roleBadge}</span>
                    </div>
                    <div class="stats-data-block">`;
                for (const col of finalCols) {
                    const v = getStatValue(p, col, section);
                    const display = (v === null || v === undefined) ? '—' : v;
                    const zeroCls = (v === 0) ? ' zero' : '';
                    html += `<div class="stats-cell${zeroCls}">${display}</div>`;
                }
                html += `</div></div>`;
            });

            document.getElementById('statsTableWrap').innerHTML = html;

            // Sync horizontal scroll across all data blocks
            const blocks = document.querySelectorAll('.stats-row .stats-data-block');
            let syncing = false;
            blocks.forEach(blk => {
                blk.addEventListener('scroll', () => {
                    if (syncing) return;
                    syncing = true;
                    const left = blk.scrollLeft;
                    blocks.forEach(other => { if (other !== blk) other.scrollLeft = left; });
                    requestAnimationFrame(() => { syncing = false; });
                });
            });
        }

        AUTH.requireLogin(function(user) {
            renderPeriodTabs();
            loadMatches(currentPeriod);
            initPullRefresh({
                onRefresh: () => { delete matchCache[currentPeriod]; return loadMatches(currentPeriod); }
            });
            startLiveClockTickers();
        });

        // Live clock & countdown ticker.
        // 1Hz tick → re-renders all .live-clock and .countdown-clock DOM elements
        //            without re-rendering the entire match card. Cheap; no layout thrash.
        // 30s background refresh → silently re-fetch /api/matches so anchor (fetched_at)
        //            stays fresh and FIFA period transitions (HT → 2H) are picked up.
        function startLiveClockTickers() {
            setInterval(updateLiveClocksTick, 1000);
            setInterval(refreshMatchesQuietly, 30 * 1000);
        }

        function updateLiveClocksTick() {
            const now = Date.now();
            // Update live clocks (in-progress matches)
            document.querySelectorAll('.live-clock').forEach(el => {
                const lc = {
                    period: parseInt(el.dataset.period) || null,
                    match_time: el.dataset.matchTime || '',
                    fetched_at: el.dataset.fetchedAt || '',
                };
                const next = formatLiveClock(lc, now);
                if (el.textContent !== next) el.textContent = next;
            });
            // Update countdowns (pre-match within last hour)
            document.querySelectorAll('.countdown-clock').forEach(el => {
                const koMs = parseInt(el.dataset.koMs);
                if (!koMs) return;
                const delta = koMs - now;
                if (delta < 0) {
                    // Already kicked off — wait for next /api/matches refresh to flip status
                    el.textContent = '00:00';
                    return;
                }
                const next = formatCountdown(delta);
                if (el.textContent !== next) el.textContent = next;
            });
        }

        async function refreshMatchesQuietly() {
            // Only when there are live matches or pre-match countdowns visible.
            // Avoid wasteful traffic when the page only shows finished matches.
            if (!document.querySelector('.live-clock, .countdown-clock')) return;
            try {
                delete matchCache[currentPeriod];
                await loadMatches(currentPeriod);
            } catch (_) {}
        }
    </script>
</body>
</html>

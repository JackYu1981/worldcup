<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投注方案 - 世界杯投注助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 16px;
        }
        h1 { font-size: 20px; text-align: center; padding: 12px 0; }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .nav-tab {
            padding: 8px 16px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tab.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
            font-weight: 600;
        }
        .plan-card {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .plan-card:active {
            transform: scale(0.98);
        }
        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-title {
            font-size: 16px;
            font-weight: 600;
        }
        .plan-date {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .plan-arrow {
            font-size: 18px;
            transition: transform 0.3s;
        }
        .plan-card.expanded .plan-arrow {
            transform: rotate(180deg);
        }
        .plan-meta {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.85;
        }
        .plan-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .plan-card.expanded .plan-detail {
            max-height: 2000px;
        }
        .plan-detail-inner {
            padding-top: 14px;
            margin-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .combo-section {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .combo-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .combo-odds {
            color: #ffcc02;
        }
        .leg-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            opacity: 0.9;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .leg-item:last-child { border-bottom: none; }
        .stake-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.15);
            font-size: 13px;
        }
        .potential-return { color: #a5d6a7; font-weight: 600; }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>⚽ 世界杯投注助手</h1>

    <div class="nav-tabs">
        <a class="nav-tab" href="index.html">选择</a>
        <a class="nav-tab active" href="result.html">方案</a>
        <a class="nav-tab" href="dashboard.html">看板</a>
    </div>

    <div id="content">
        <div class="empty-state">
            <p>加载中...</p>
        </div>
    </div>

    <script>
        const RESULTS_INDEX_URL = 'https://api.github.com/repos/JackYu1981/worldcup/contents/results';

        let allResults = [];

        async function loadAllResults() {
            try {
                const resp = await fetch(RESULTS_INDEX_URL);
                const files = await resp.json();
                const resultFiles = files
                    .filter(f => f.name.endsWith('.json'))
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (resultFiles.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="empty-state"><p>暂无投注方案</p></div>';
                    return;
                }

                const results = await Promise.all(resultFiles.map(async f => {
                    const r = await fetch(f.download_url);
                    return r.json();
                }));

                allResults = results;
                renderAllPlans();
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
            }
        }

        function togglePlan(el) {
            el.classList.toggle('expanded');
        }

        function renderAllPlans() {
            const content = document.getElementById('content');

            const html = allResults.map((data, idx) => {
                const combosHtml = data.combinations.map((c, i) => {
                    const legsHtml = c.legs.map(l =>
                        `<div class="leg-item">
                            <span>${l.match_desc} · ${l.pick_desc}</span>
                            <span>@${l.odds.toFixed(2)}</span>
                        </div>`
                    ).join('');
                    return `<div class="combo-section">
                        <div class="combo-header">
                            <span>组合 ${i + 1}</span>
                            <span class="combo-odds">×${c.combined_odds.toFixed(2)}</span>
                        </div>
                        ${legsHtml}
                        <div class="stake-info">
                            <span>投注 ¥${c.stake}</span>
                            <span class="potential-return">可得 ¥${c.potential_return.toLocaleString()}</span>
                        </div>
                    </div>`;
                }).join('');

                return `<div class="plan-card" onclick="togglePlan(this)">
                    <div class="plan-header">
                        <div>
                            <div class="plan-title">${data.passphrase || '未命名'}</div>
                            <div class="plan-date">${data.date} · ${data.combinations.length}注</div>
                        </div>
                        <div class="plan-arrow">▼</div>
                    </div>
                    <div class="plan-meta">
                        <span>投入 ¥${data.budget}</span>
                        <span>回报 ¥${data.expected_return_range}</span>
                    </div>
                    <div class="plan-detail">
                        <div class="plan-detail-inner">
                            ${combosHtml}
                        </div>
                    </div>
                </div>`;
            }).join('');

            content.innerHTML = html;
        }

        loadAllResults();
    </script>
</body>
</html>

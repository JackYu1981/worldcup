<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投注方案 - 世界杯投注助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 16px;
        }
        h1 { font-size: 20px; text-align: center; padding: 12px 0; }
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .nav-tab {
            padding: 8px 16px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tab.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
            font-weight: 600;
        }
        .plan-card {
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .plan-summary {
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .plan-summary:active {
            opacity: 0.9;
        }
        .plan-card.pending .plan-summary {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
        }
        .plan-card.won .plan-summary {
            background: linear-gradient(135deg, #ef5350, #c62828);
            color: white;
        }
        .plan-card.lost .plan-summary {
            background: linear-gradient(135deg, #a5d6a7, #66bb6a);
            color: white;
        }
        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-title {
            font-size: 16px;
            font-weight: 600;
        }
        .plan-date {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .plan-arrow {
            font-size: 18px;
            transition: transform 0.3s;
        }
        .plan-card.expanded .plan-arrow {
            transform: rotate(180deg);
        }
        .plan-meta {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.85;
        }
        .plan-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: white;
        }
        .plan-card.expanded .plan-detail {
            max-height: 2000px;
        }
        .plan-detail-inner {
            padding: 16px;
        }
        .combo-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #eee;
        }
        .combo-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .combo-odds {
            color: #e65100;
        }
        .leg-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            color: #555;
            border-bottom: 1px solid #f0f0f0;
        }
        .leg-item:last-child { border-bottom: none; }
        .stake-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #333;
        }
        .potential-return { color: #2e7d32; font-weight: 600; }
        .copy-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
            color: #333;
            cursor: pointer;
            text-align: center;
        }
        .copy-btn:active { background: #e0e0e0; }
        .leg-correct { color: #2e7d32; }
        .leg-correct .odds-val { color: #c62828; font-weight: 700; }
        .leg-wrong { color: #999; text-decoration: line-through; }
        .combo-hit {
            background: #ffebee;
            border-color: #ef9a9a;
        }
        .combo-miss {
            background: #e8f5e9;
            border-color: #a5d6a7;
            opacity: 0.7;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>⚽ 世界杯投注助手</h1>

    <div class="nav-tabs">
        <a class="nav-tab" href="index.html">赛程</a>
        <a class="nav-tab" href="recommend.html">推荐</a>
        <a class="nav-tab active" href="result.html">方案</a>
        <a class="nav-tab" href="dashboard.html">看板</a>
        <a class="nav-tab" href="design.html">修订</a>
    </div>

    <div id="content">
        <div class="empty-state">
            <p>加载中...</p>
        </div>
    </div>

    <script>
        const RESULTS_INDEX_URL = 'https://api.github.com/repos/JackYu1981/worldcup/contents/results';
        const PICKS_INDEX_URL = 'https://api.github.com/repos/JackYu1981/worldcup/contents/picks';

        let allResults = [];
        let matchDataCache = {};

        async function fetchMatchData(date) {
            if (matchDataCache[date]) return matchDataCache[date];
            try {
                const resp = await fetch(`/api/matches?date=${date}`);
                if (resp.ok) {
                    const data = await resp.json();
                    matchDataCache[date] = data.matches || [];
                    return matchDataCache[date];
                }
            } catch(e) {}
            matchDataCache[date] = [];
            return [];
        }

        function determineResult(match) {
            if (!match.score) return null;
            const parts = match.score.split('-');
            const home = parseInt(parts[0]), away = parseInt(parts[1]);
            const diff = home - away;
            const handicapLine = match.handicap ? match.handicap.line : 0;
            const adjustedDiff = diff + handicapLine;
            return {
                '1x2': diff > 0 ? 'home_win' : diff === 0 ? 'draw' : 'away_win',
                'handicap': adjustedDiff > 0 ? 'home_win' : adjustedDiff === 0 ? 'draw' : 'away_win',
                score: match.score
            };
        }

        function evaluateLegs(data, matchesByDate) {
            const matches = matchesByDate || [];
            if (!data.legs && data.combinations) {
                data.combinations.forEach(c => {
                    let allCorrect = true, anyEvaluated = false;
                    c.legs.forEach(l => {
                        const m = matches.find(x => x.id === l.match_id);
                        if (m && m.score) {
                            const result = determineResult(m);
                            const market = l.market || '1x2';
                            l.correct = result[market] === l.pick;
                            l.actual_score = result.score;
                            anyEvaluated = true;
                            if (!l.correct) allCorrect = false;
                        }
                    });
                    if (anyEvaluated) c.hit = allCorrect;
                });
            } else if (data.legs) {
                let allCorrect = true, anyEvaluated = false;
                data.legs.forEach(l => {
                    const m = matches.find(x => x.id === l.match_id);
                    if (m && m.score) {
                        const result = determineResult(m);
                        const market = l.market || '1x2';
                        l.correct = result[market] === l.pick;
                        l.actual_score = result.score;
                        anyEvaluated = true;
                        if (!l.correct) allCorrect = false;
                    }
                });
                if (anyEvaluated) {
                    if (!data.combinations) {
                        data.combinations = [{ legs: data.legs, combined_odds: data.combined_odds || 1, stake: data.stake || 100, potential_return: Math.round((data.combined_odds || 1) * (data.stake || 100)), hit: allCorrect }];
                    }
                }
            }
            return data;
        }

        async function loadAllResults() {
            try {
                const [resultsResp, picksResp] = await Promise.all([
                    fetch(RESULTS_INDEX_URL).catch(() => null),
                    fetch(PICKS_INDEX_URL).catch(() => null)
                ]);

                let allFiles = [];
                if (resultsResp && resultsResp.ok) {
                    const files = await resultsResp.json();
                    allFiles = allFiles.concat(files.filter(f => f.name.endsWith('.json')));
                }
                if (picksResp && picksResp.ok) {
                    const files = await picksResp.json();
                    const planFiles = files.filter(f => f.name.endsWith('.json') && !f.name.includes('-rec-'));
                    allFiles = allFiles.concat(planFiles);
                }

                allFiles.sort((a, b) => b.name.localeCompare(a.name));

                if (allFiles.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="empty-state"><p>暂无投注方案</p></div>';
                    return;
                }

                const results = await Promise.all(allFiles.map(async f => {
                    const r = await fetch(f.download_url);
                    return r.json();
                }));

                const planResults = results.filter(r => r.source === 'plan' || r.combinations || (!r.source));

                const dates = [...new Set(planResults.map(r => r.date).filter(Boolean))];
                await Promise.all(dates.map(d => fetchMatchData(d)));

                allResults = planResults.map(data => {
                    if (!data.combinations && data.legs) {
                        data.combinations = [{
                            legs: data.legs,
                            combined_odds: data.combined_odds || 1,
                            stake: data.stake || 100,
                            potential_return: Math.round((data.combined_odds || 1) * (data.stake || 100)),
                            hit: null
                        }];
                    }
                    const matches = matchDataCache[data.date] || [];
                    return evaluateLegs(data, matches);
                });

                renderAllPlans();
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
            }
        }

        function togglePlan(el) {
            el.classList.toggle('expanded');
        }

        function renderAllPlans() {
            const content = document.getElementById('content');

            if (allResults.length === 0) {
                content.innerHTML = '<div class="empty-state"><p>暂无投注方案</p></div>';
                return;
            }

            const html = allResults.map((data, idx) => {
                if (!data.combinations || data.combinations.length === 0) {
                    return '';
                }
                const combosHtml = data.combinations.map((c, i) => {
                    const legsHtml = c.legs.map(l => {
                        let icon = '';
                        if (l.correct === true) icon = ' ✓';
                        else if (l.correct === false) icon = ' ✗';
                        const legClass = l.correct === true ? 'leg-correct' : l.correct === false ? 'leg-wrong' : '';
                        const scoreInfo = l.actual_score ? ` (${l.actual_score})` : '';
                        return `<div class="leg-item ${legClass}">
                            <span>${l.code || ''} ${l.match_desc} · ${l.pick_desc}${scoreInfo}${icon}</span>
                            <span class="odds-val">@${l.odds.toFixed(2)}</span>
                        </div>`;
                    }).join('');
                    const hitLabel = c.hit === true ? ' ✓ 命中' : c.hit === false ? ' ✗' : '';
                    const comboClass = c.hit === true ? 'combo-hit' : c.hit === false ? 'combo-miss' : '';
                    return `<div class="combo-section ${comboClass}">
                        <div class="combo-header">
                            <span>组合 ${i + 1}${hitLabel}</span>
                            <span class="combo-odds">×${c.combined_odds.toFixed(2)}</span>
                        </div>
                        ${legsHtml}
                        <div class="stake-info">
                            <span>投注 ¥${c.stake}</span>
                            <span class="potential-return">${c.hit ? '中奖' : '可得'} ¥${c.potential_return.toLocaleString()}</span>
                        </div>
                        <button class="copy-btn" onclick="event.stopPropagation();copyCombo(${idx},${i})">📋 复制竞彩格式</button>
                    </div>`;
                }).join('');

                const status = data.status || 'pending';
                const statusLabel = status === 'won' ? ' 🎉 中奖' : status === 'lost' ? ' 💣 未中' : '';
                const budget = data.budget || data.stake || 100;
                const totalReturn = data.expected_return_range || `¥${Math.round((data.combined_odds || 1) * budget)}`;
                const by = data.submitted_by ? ` · by ${data.submitted_by}` : '';

                return `<div class="plan-card ${status}" onclick="togglePlan(this)">
                    <div class="plan-summary">
                        <div class="plan-header">
                            <div>
                                <div class="plan-title">${data.passphrase || '未命名'}${statusLabel}</div>
                                <div class="plan-date">${data.date} · ${data.combinations.length}注${by}</div>
                            </div>
                            <div class="plan-arrow">▼</div>
                        </div>
                        <div class="plan-meta">
                            <span>投入 ¥${budget}</span>
                            <span>回报 ${typeof totalReturn === 'number' ? '¥' + totalReturn : totalReturn}</span>
                        </div>
                    </div>
                    <div class="plan-detail">
                        <div class="plan-detail-inner">
                            ${combosHtml}
                        </div>
                    </div>
                </div>`;
            }).join('');

            content.innerHTML = html || '<div class="empty-state"><p>暂无投注方案</p></div>';
        }

        function copyCombo(resultIdx, comboIdx) {
            const combo = allResults[resultIdx].combinations[comboIdx];
            const lines = combo.legs.map((l, i) => {
                const code = String(i+1).padStart(3, '0');
                return `${code} ${l.match_desc} ${l.pick_desc}`;
            });
            navigator.clipboard.writeText(lines.join('\n')).then(() => {
                const btn = event.target;
                btn.textContent = '✅ 已复制';
                setTimeout(() => btn.textContent = '📋 复制竞彩格式', 1500);
            }).catch(() => {});
        }

        loadAllResults();
    </script>
</body>
</html>

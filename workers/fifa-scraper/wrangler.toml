name = "worldcup-fifa-scraper"
main = "index.js"
compatibility_date = "2024-09-01"

# Crons:
#   */10 * * * *  → mainCron     — lineup poller (KO-90min ~ KO_end+15min window).
#                                   A+D short-circuit caps writes at ≤3/fixture/tick.
#   0 1 * * *     → calendarCron  — daily fifa_calendar refresh at UTC 01:00 = Beijing 09:00.
#                                   1 write/day. Picks up newly-added knockout fixtures
#                                   + keeps match_status field current.
[triggers]
crons = [
  "*/10 * * * *",
  "0 1 * * *"
]

[[kv_namespaces]]
binding = "MATCH_DATA"
id = "278f1209ffd84662bd51921370a2fbe9"

name = "worldcup-fifa-scraper"
main = "index.js"
compatibility_date = "2024-09-01"

# Single cron: lineup poller. Triggers every 10 min, but does nothing unless
# at least one 500.com 世界杯 fixture is currently in [KO-90min, KO_end+15min].
#
# fifa_calendar mapping is now LAZY — main cron fetches FIFA calendar on demand
# (cold start or manual KV flush) and caches it in KV indefinitely.
#
# Currently disabled (CF KV daily limit hit on 2026-06-22). To re-enable:
#   1. Uncomment the cron line below
#   2. npx wrangler deploy
[triggers]
crons = [
  # "*/10 * * * *"
]

[[kv_namespaces]]
binding = "MATCH_DATA"
id = "278f1209ffd84662bd51921370a2fbe9"
